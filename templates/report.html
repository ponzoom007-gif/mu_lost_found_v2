{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h2>📝 ลงประกาศตามหา / แจ้งเก็บของได้</h2>
    <p style="color: var(--text-muted); margin-bottom: 24px;">ข้อมูลจะถูกเผยแพร่ในระบบสำหรับนักศึกษาและบุคลากรมหาวิทยาลัยมหิดล</p>

    <form action="{{ url_for('report') }}" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label>เลือกประเภทการประกาศ *</label>
            <div class="type-toggle-group">
                <label class="type-toggle-card selected-found" id="label_found">
                    <input type="radio" name="item_type" value="found" checked> 🟢 เก็บของได้ (Found)
                </label>
                <label class="type-toggle-card" id="label_lost">
                    <input type="radio" name="item_type" value="lost"> 🔴 ทำของหาย (Lost)
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="title">ชื่อสิ่งของ *</label>
            <input type="text" id="title" name="title" placeholder="เช่น หูฟัง Sony WF-1000XM5 สีดำ, บัตรนักศึกษา, กระเป๋าสตางค์" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">หมวดหมู่สิ่งของ *</label>
                <select id="category" name="category" required>
                    <option value="อุปกรณ์อิเล็กทรอนิกส์">อุปกรณ์อิเล็กทรอนิกส์</option>
                    <option value="กระเป๋า / กระเป๋าสตางค์">กระเป๋า / กระเป๋าสตางค์</option>
                    <option value="บัตรประชาชน / บัตรนักศึกษา">บัตรประชาชน / บัตรนักศึกษา</option>
                    <option value="กุญแจ / พวงกุญแจ">กุญแจ / พวงกุญแจ</option>
                    <option value="เอกสาร / ตำราเรียน">เอกสาร / ตำราเรียน</option>
                    <option value="เครื่องแต่งกาย / เครื่องประดับ">เครื่องแต่งกาย / เครื่องประดับ</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                </select>
            </div>

            <div class="form-group">
                <label for="faculty_location">คณะ / สถานที่ที่พบหรือทำหาย *</label>
                <select id="faculty_location" name="faculty_location" required>
                    {% for loc in locations %}
                        <option value="{{ loc }}">{{ loc }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="incident_date">📅 วันที่เกิดเหตุ *</label>
                <input type="date" id="incident_date" name="incident_date" required>
            </div>

            <div class="form-group">
                <label for="incident_time">⏰ เวลาโดยประมาณ *</label>
                <input type="time" id="incident_time" name="incident_time" required>
            </div>
        </div>

        <div class="form-group">
            <label for="description">รายละเอียดและลักษณะเพิ่มเติม</label>
            <textarea id="description" name="description" placeholder="ระบุสี ตำหนิ แบรนด์ หรือจุดที่คาดว่าทำตกหล่นอย่างชัดเจน..."></textarea>
        </div>

        <!-- กล่องยืนยันความเป็นเจ้าของ (Anti-Spoofing) -->
        <div class="form-group" style="background: #F0FDF4; border: 1.5px solid #86EFAC; padding: 16px; border-radius: var(--radius-md);">
            <label id="verification_label" for="verification_question" style="color: #166534; font-weight: 700;">🛡️ คำถามยืนยันความเป็นเจ้าของ (Anti-Spoofing Question)</label>
            <input type="text" id="verification_question" name="verification_question" placeholder="เช่น 'กระเป๋าสตางค์มีบัตรอะไรอยู่ข้างในบ้าง?' หรือ 'เคสข้างหลังติดสติ๊กเกอร์ลายอะไร?'">
            <small id="verification_hint" style="color: #15803D; font-size: 0.85rem; margin-top: 5px; display: block;">* เจ้าของที่มาขอรับของจะต้องตอบคำถามนี้ให้ถูกต้อง เพื่อป้องกันมิจฉาชีพสวมรอย</small>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="item_image">📷 รูปถ่ายสิ่งของ (สูงสุด 5MB)</label>
                <input type="file" id="item_image" name="item_image" accept="image/png, image/jpeg, image/webp">
            </div>

            <div class="form-group">
                <label for="found_spot_image">📍 รูปถ่ายจุดที่พบ / ทำหาย (สูงสุด 5MB)</label>
                <input type="file" id="found_spot_image" name="found_spot_image" accept="image/png, image/jpeg, image/webp">
            </div>
        </div>

        <div id="custody_wrapper">
            <hr style="margin: 24px 0; border: 0; border-top: 1.5px solid var(--border-color);">

            <div class="form-group">
                <label>การจัดการสิ่งของในปัจจุบัน *</label>
                <div class="radio-group" style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="font-weight: 500; cursor: pointer;">
                        <input type="radio" name="custody_type" value="dropped" id="custody_dropped" checked> 
                        🏢 ฝากไว้ที่จุดรับฝาก / หน่วยงาน (เช่น ป้อมยามวิศวะ, เคาน์เตอร์ MLC, หอสมุด)
                    </label>
                    <label style="font-weight: 500; cursor: pointer;">
                        <input type="radio" name="custody_type" value="keep_self" id="custody_keep"> 
                        🙋‍♂️ เก็บไว้กับตัวเอง (รอเจ้าของติดต่อเพื่อนัดรับ)
                    </label>
                </div>
            </div>

            <div id="drop_section" class="conditional-box">
                <div class="form-group">
                    <label for="drop_location_detail">ระบุจุดที่นำของไปฝากไว้อย่างละเอียด *</label>
                    <input type="text" id="drop_location_detail" name="drop_location_detail" placeholder="เช่น ป้อมยามประตู 1 คณะวิศวกรรมศาสตร์ หรือเคาน์เตอร์ชั้น 1 MLC">
                </div>
                <div class="form-group">
                    <label for="drop_spot_image">📸 รูปถ่ายจุดที่ฝากไว้ / ใบรับฝาก (สูงสุด 5MB)</label>
                    <input type="file" id="drop_spot_image" name="drop_spot_image" accept="image/png, image/jpeg, image/webp">
                </div>
            </div>
        </div>

        <div id="contact_section" class="conditional-box" style="display: none;">
            <div class="form-group">
                <label id="contact_label" for="contact_info">ช่องทางการติดต่อสำหรับรับของ *</label>
                <input type="text" id="contact_info" name="contact_info" placeholder="เช่น เบอร์โทรศัพท์ 081-xxx-xxxx / Line ID: xxx">
            </div>
        </div>

        <button type="submit" class="btn-submit btn-block" style="margin-top: 10px;">ยืนยันการลงประกาศ</button>
    </form>
</div>
{% endblock %}
