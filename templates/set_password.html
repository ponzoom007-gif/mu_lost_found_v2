{% extends "base.html" %}
{% block content %}
<div class="form-card">
    <h1>ตั้งรหัสผ่านใหม่</h1>
    <p>ตั้งรหัสผ่านอย่างน้อย 12 ตัวอักษรสำหรับการเข้าสู่ระบบครั้งถัดไป</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if requires_current_password %}
        <label for="current_password">รหัสผ่านปัจจุบัน</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
        {% endif %}
        <label for="password">รหัสผ่านใหม่ (อย่างน้อย 12 ตัวอักษร)</label>
        <input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required>
        <label for="confirm_password">ยืนยันรหัสผ่าน</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
        <button type="submit" class="btn-nav">บันทึกรหัสผ่าน</button>
    </form>
    <a href="{{ url_for('index') }}">ใช้ Google ต่อไปและตั้งรหัสผ่านภายหลัง</a>
</div>
{% endblock %}
